[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cf_data_struct"
description = "Climate & Forecast data structures with netCDF export templates"
readme = "README.md"
version = "0.1"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = []
authors = [
  { name = "Stefan Hendricks", email = "stefan.hendricks@awi.de" },
]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "loguru",
    "netcdf4",
    "numpy",
    "pydantic",
    "pydantic-yaml",
    "xarray"
]

[project.optional-dependencies]
tests = [
    "flake8",
    "isort",
    "pytest",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/pysiral/cf-data-struct"
Documentation = "https://github.com/pysiral/cf-data-struct#readme"
Issues = "https://github.com/pysiral/cf-data-struct/issues"
Source = "https://github.com/pysiral/cf-data-struct"
